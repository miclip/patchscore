# Dependabot, for the reason the repo already had a critical nobody was told about.
#
# `npm audit` found a Next.js RCE, a `sharp` high underneath it and two moderates in vitest,
# while the repo's Dependabot alerts were switched off. This file is the half that lives in git;
# the alerts themselves are a repository setting and have to be enabled in Settings → Advanced
# Security, which no file here can do.
#
# Weekly rather than daily: this is a two-person repo and a daily cadence on a Next.js app is a
# pull request most mornings, which is how a security bot becomes noise somebody mutes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One PR for a framework and its ecosystem rather than six. Next, React and the types move
    # together often enough that separate PRs would each fail CI until the last one landed.
    #
    # **Minor and patch only, and a major always arrives alone.** The first run of this file
    # grouped `@types/node` 20 to 26, TypeScript 5.9 to 7.0 and vitest 3 to 5 into one red pull
    # request. TypeScript 7 is the Go rewrite — a compiler change rather than a dependency bump —
    # and bundled with two other majors there was no way to tell which of the three broke the
    # build, or to take the two that were fine. Grouping is for the updates nobody reads
    # individually; a major is exactly the update somebody has to.
    groups:
      next:
        update-types:
          - minor
          - patch
        patterns:
          - next
          - '@next/*'
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - vitest
          - '@vitest/*'
          - typescript
          - '@types/*'
          - eslint
          - '@eslint/*'
          - prettier
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
